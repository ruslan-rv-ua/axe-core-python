[project]
name = "axe-core-python"
version = "0.1.0"
description = "Automated web accessibility testing using axe-core engine."
authors = [
    { name = "Ruslan Iskov", email = "ruslan.rv.ua@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["accessibility", "axe", "axe-core", "selenium", "playwright"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Adaptive Technologies",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ruslan-rv-ua/axe-core-python"
Repository = "https://github.com/ruslan-rv-ua/axe-core-python"
Documentation = "https://ruslan-rv-ua.github.io/axe-core-python/"



[project.scripts]
update-axe = "scripts.update_axe:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/axe_core_python", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "selenium: marks tests as selenium-based",
    "playwright: marks tests as playwright-based",
    "unit: marks tests as unit tests (fast)",
    "integration: marks tests as integration tests",
    "chrome: marks tests for Chrome browser",
    "firefox: marks tests for Firefox browser",
    "chromium: marks tests for Chromium browser",
    "webkit: marks tests for WebKit browser",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "playwright>=1.57.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.10",
    "selenium>=4.39.0",
]
